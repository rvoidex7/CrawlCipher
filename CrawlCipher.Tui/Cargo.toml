# Failed to link against C# .lib file (NativeAOT issue on Windows)
# Switching to dynamic loading via libloading crate.

[package]
name = "crawlcipher-tui"
version = "0.2.4"
edition = "2021"
authors = ["crawlcipher Developer"]
description = "crawlcipher TUI - Rust terminal user interface for crawlcipher game"

[[bin]]
name = "crawlcipher"
path = "src/main.rs"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
libloading = "0.8"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
base64 = "0.21"
stellar-strkey = "0.0.8"
ed25519-dalek = "3.0"
rand = "0.10"
webbrowser = "1.2"
rust-embed = "8.0"
