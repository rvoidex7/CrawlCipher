name: Feature Request
description: Suggest a new feature
title: "[FEATURE]: "
labels: ["enhancement"]
assignees:
  - rvoidex7

body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature to CrawlCipher! Please fill out the form below.

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How critical is this feature request?
      options:
        - Critical / High Priority
        - Medium Priority
        - Low Priority / Nice to Have
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve?
      placeholder: Currently I cannot ... because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should this be solved?
      placeholder: Add a feature that allows ...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component does this affect?
      multiple: true
      options:
        - C# Game Engine
        - Rust TUI
        - Stellar Integration
        - Gameplay Mechanics
        - Inventory System
        - Expedition Mode
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Are there other ways to solve this?

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please check the following
      options:
        - label: I have searched existing issues to ensure this feature hasn't been requested already.
          required: true
